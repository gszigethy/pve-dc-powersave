name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate and release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release version from changelog
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## \[(\d+\.\d+\.\d+)\]", text, re.MULTILINE)
          if not match:
              raise SystemExit("No semantic version entry found in CHANGELOG.md")
          print(match.group(1))
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_NAME}" != "v$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match top changelog version v$VERSION"
            exit 1
          fi

      - name: Require release commit to be on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "::error::Release tag must point to a commit contained in main"
            exit 1
          fi

      - name: Install native analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libperl-critic-perl shellcheck

      - name: Perl tests
        run: prove -Ilib t

      - name: Compile standalone Perl modules and daemon
        run: |
          find lib/PVE/DC -name '*.pm' -print0 | xargs -0 -n1 perl -Ilib -c
          perl -Ilib -c bin/pve-dc-powersave

      - name: Perl correctness and security analysis
        run: perlcritic --profile .perlcriticrc lib bin/pve-dc-powersave

      - name: ShellCheck
        run: shellcheck scripts/install.sh

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Python 3.11 tests
        run: python -m unittest discover -s pytests -v

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Python 3.13 tests
        run: python -m unittest discover -s pytests -v

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: JavaScript syntax
        run: node --check web/dc-powersave.js

      - name: Validate systemd unit
        run: |
          UNIT_ROOT=$(mktemp -d "$RUNNER_TEMP/pve-unit.XXXXXX")
          trap 'rm -rf "$UNIT_ROOT"' EXIT
          mkdir -p "$UNIT_ROOT/usr/sbin" "$UNIT_ROOT/etc/systemd/system"
          install -m 755 bin/pve-dc-powersave "$UNIT_ROOT/usr/sbin/pve-dc-powersave"
          cp systemd/*.service "$UNIT_ROOT/etc/systemd/system/"
          for unit in pve-cluster pvedaemon; do
            printf '[Service]\nExecStart=/usr/sbin/pve-dc-powersave\n' > "$UNIT_ROOT/etc/systemd/system/$unit.service"
          done
          for target in sysinit basic shutdown; do
            printf '[Unit]\nDescription=CI target\n' > "$UNIT_ROOT/etc/systemd/system/$target.target"
          done
          systemd-analyze verify --root="$UNIT_ROOT" /etc/systemd/system/pve-dc-powersave.service

      - name: Build release archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE="pve-dc-powersave-${VERSION}.tar.gz"
          git archive --format=tar.gz --prefix="pve-dc-powersave-${VERSION}/" -o "$ARCHIVE" "${GITHUB_SHA}"
          sha256sum "$ARCHIVE" > SHA256SUMS
          test -s "$ARCHIVE"
          test -s SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: "pve-dc-powersave ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            pve-dc-powersave-${{ steps.version.outputs.version }}.tar.gz
            SHA256SUMS
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'pre') }}
