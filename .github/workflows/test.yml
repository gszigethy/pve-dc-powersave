name: Native quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install native analyzers
        run: sudo apt-get update && sudo apt-get install -y libperl-critic-perl shellcheck
      - name: Perl tests
        run: prove -Ilib t
      - name: Compile standalone Perl modules and daemon
        run: |
          find lib/PVE/DC -name '*.pm' -print0 | xargs -0 -n1 perl -Ilib -c
          perl -Ilib -c bin/pve-dc-powersave
      - name: Perl::Critic severity 1 diagnostics (initial baseline report)
        continue-on-error: true
        run: perlcritic --severity 1 lib bin/pve-dc-powersave
      - name: ShellCheck
        run: shellcheck scripts/install.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/integrate-pve.py
      - name: Validate systemd unit in isolated CI root
        run: |
          UNIT_ROOT=$(mktemp -d "$RUNNER_TEMP/pve-unit.XXXXXX")
          trap 'rm -rf "$UNIT_ROOT"' EXIT
          mkdir -p "$UNIT_ROOT/usr/sbin" "$UNIT_ROOT/etc/systemd/system"
          install -m 755 bin/pve-dc-powersave "$UNIT_ROOT/usr/sbin/pve-dc-powersave"
          cp systemd/*.service "$UNIT_ROOT/etc/systemd/system/"
          for unit in pve-cluster pvedaemon; do
            printf '[Service]\nExecStart=/usr/sbin/pve-dc-powersave\n' > "$UNIT_ROOT/etc/systemd/system/$unit.service"
          done
          for target in sysinit basic shutdown; do
            printf '[Unit]\nDescription=CI target\n' > "$UNIT_ROOT/etc/systemd/system/$target.target"
          done
          systemd-analyze verify --root="$UNIT_ROOT" /etc/systemd/system/pve-dc-powersave.service
