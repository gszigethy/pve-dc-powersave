sonar.organization=gszigethy
sonar.projectKey=gszigethy_pve-dc-powersave

# SonarQube Cloud has no native Perl analyzer. Perl remains covered by
# prove, Perl::Critic and Devel::Cover in GitHub Actions.
sonar.sources=scripts,web
sonar.tests=pytests

sonar.exclusions=scripts/install.sh
sonar.coverage.exclusions=web/**
sonar.python.version=3.11,3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.cpd.exclusions=pytests/**
